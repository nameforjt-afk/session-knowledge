name: Feature request
description: Propose a focused improvement to session-knowledge
title: "enhancement: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user-facing limitation before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: What should a user be able to observe or accomplish?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This proposal can preserve zero runtime dependencies.
        - label: I can contribute a pull request with tests.
